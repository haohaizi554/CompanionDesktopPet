name: CI and Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_UI_LANGUAGE: "en"
  PYTHONUTF8: "1"

defaults:
  run:
    shell: pwsh

jobs:
  quality-gates:
    name: Quality gates
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install pinned Python CI dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          & python -m pip install `
            --disable-pip-version-check `
            --require-hashes `
            --only-binary=:all: `
            --requirement .github/requirements-ci.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned Python CI dependency installation failed with exit code $LASTEXITCODE."
          }

      - name: Set up .NET
        id: setup-dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Verify committed .NET SDK
        env:
          SELECTED_DOTNET_SDK: ${{ steps.setup-dotnet.outputs.dotnet-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $selectedSdk = $env:SELECTED_DOTNET_SDK.Trim()
          $sdkContract = Get-Content -LiteralPath 'global.json' -Raw -Encoding utf8 |
            ConvertFrom-Json
          $expectedSdk = $sdkContract.sdk.version
          if ($expectedSdk -notmatch '^9\.0\.\d+$' -or
              $sdkContract.sdk.rollForward -cne 'disable' -or
              $sdkContract.sdk.allowPrerelease -ne $false) {
            throw 'Committed global.json must pin one stable .NET 9 SDK with rollForward=disable.'
          }
          $actualSdk = ((& dotnet --version 2>&1) -join "`n").Trim()
          if ($LASTEXITCODE -ne 0 -or
              $selectedSdk -cne $expectedSdk -or
              $actualSdk -cne $expectedSdk) {
            throw "The active .NET SDK differs from the committed contract: expected=$expectedSdk selected=$selectedSdk actual=$actualSdk"
          }
          Write-Output "Verified committed .NET SDK $actualSdk for this job."

      - name: Record toolchain and committed evidence
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'ci-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null

          $trackedSimulation = 'reports/simulation-events.json'
          & git ls-files --error-unmatch -- $trackedSimulation | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "$trackedSimulation must be committed."
          }

          $tzdataVersion = & python -c "import importlib.metadata as metadata; print(metadata.version('tzdata'))"
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to record the installed tzdata version.'
          }

          @(
            "Event=$env:GITHUB_EVENT_NAME"
            "Ref=$env:GITHUB_REF"
            "Commit=$env:GITHUB_SHA"
            "Python=$(& python --version 2>&1)"
            "Tzdata=$tzdataVersion"
            "DotNetSdk=$(& dotnet --version 2>&1)"
            "SimulationEventsSHA256=$((Get-FileHash -LiteralPath $trackedSimulation -Algorithm SHA256).Hash.ToLowerInvariant())"
          ) | Set-Content -LiteralPath (Join-Path $evidence 'environment.txt') -Encoding utf8
          & dotnet --info 2>&1 | Set-Content -LiteralPath (Join-Path $evidence 'dotnet-info.txt') -Encoding utf8

      - name: Verify CI test evidence parser contract
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:GITHUB_WORKSPACE 'ci-evidence/ci-test-evidence-contract.txt'
          $contract = Join-Path $env:GITHUB_WORKSPACE 'tests/Ci-TestEvidence.Contract.ps1'
          $output = @(& $contract 2>&1)
          $output | Tee-Object -FilePath $log

      - name: Verify release packaging contract
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:GITHUB_WORKSPACE 'ci-evidence/release-packaging-contract.txt'
          $contract = Join-Path $env:GITHUB_WORKSPACE 'tests/Release-Packaging.Contract.ps1'
          $output = @(& $contract 2>&1)
          $output | Tee-Object -FilePath $log

      - name: Verify licensing contract
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceFile = Join-Path $env:GITHUB_WORKSPACE 'ci-evidence/license-contract.txt'
          $requiredFiles = @(
            'LICENSE.md'
            'LICENSE-SCOPE.md'
            'ASSET_AND_PERSONA_RIGHTS.md'
            'NOTICE'
          )
          $missing = @($requiredFiles | Where-Object {
            -not (Test-Path -LiteralPath $_ -PathType Leaf) -or
            (Get-Item -LiteralPath $_ -ErrorAction SilentlyContinue).Length -le 0
          })
          if ($missing.Count -ne 0) {
            "Missing or empty legal files: $($missing -join ', ')" |
              Set-Content -LiteralPath $evidenceFile -Encoding utf8
            throw "Missing or empty legal files: $($missing -join ', ')"
          }
          if (Test-Path -LiteralPath 'LICENSE') {
            throw 'The repository license source must be LICENSE.md so GitHub renders it; release packaging supplies the conventional LICENSE asset name.'
          }

          # Official tagged source:
          # https://github.com/polyformproject/polyform-licenses/blob/1.0.0/PolyForm-Noncommercial-1.0.0.md
          $expectedLicenseSha256 = 'c0ea4a896d2c8c394b29f9427589996db826cd501c512279ff0ed3ef48fabbe5'
          $actualLicenseSha256 = (Get-FileHash -LiteralPath 'LICENSE.md' -Algorithm SHA256).Hash.ToLowerInvariant()
          $requiredNoticeLines = @(
            Get-Content -LiteralPath 'NOTICE' -Encoding utf8 |
              Where-Object { $_ -match '^Required Notice:\s+\S' }
          )

          @(
            "ExpectedLicenseSHA256=$expectedLicenseSha256"
            "ActualLicenseSHA256=$actualLicenseSha256"
            "RequiredNoticeCount=$($requiredNoticeLines.Count)"
            $requiredFiles | ForEach-Object {
              "FileSHA256=$((Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant())  $_"
            }
          ) | Set-Content -LiteralPath $evidenceFile -Encoding utf8

          if ($actualLicenseSha256 -ne $expectedLicenseSha256) {
            throw 'LICENSE.md is not the byte-exact official PolyForm Noncommercial 1.0.0 text.'
          }
          if ($requiredNoticeLines.Count -eq 0) {
            throw 'NOTICE must contain a non-empty plain-text line beginning with Required Notice:.'
          }

      - name: Check generated C# persona contract
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:GITHUB_WORKSPACE 'ci-evidence/generator-check.txt'
          $output = @(& python tools/generate_persona_contract_cs.py --check 2>&1)
          $exitCode = $LASTEXITCODE
          if ($output.Count -eq 0) {
            $output = @('PASS: generated C# persona contract is current.')
          }
          $output | Tee-Object -FilePath $log
          if ($exitCode -ne 0) {
            throw "Persona contract generator check failed with exit code $exitCode."
          }

      - name: Validate corpus against committed simulation events
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:GITHUB_WORKSPACE 'ci-evidence/corpus-validation.txt'
          $output = @(& python tools/validate_corpus_v2.py `
            --corpus data/optimized/persona-corpus-v2.tsv `
            --config config/persona-scheduler.json `
            --allowlist config/persona-review-allowlist.json `
            --simulation reports/simulation-events.json 2>&1)
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $log
          if ($exitCode -ne 0) {
            throw "Corpus validation failed with exit code $exitCode."
          }

          $summary = @($output | Where-Object { $_ -match '^Validation:' }) | Select-Object -First 1
          if ($null -eq $summary -or $summary -notmatch '^Validation: 0 hard errors, (?<Count>[0-9]+) warnings$') {
            throw "Validator did not report the required zero-hard-error summary: $summary"
          }
          $warningCount = [int]$Matches['Count']
          $warningLines = @($output | Where-Object { $_ -match '^WARNING ' })
          if ($warningCount -ne $warningLines.Count) {
            throw 'Validator warning summary does not match its warning details.'
          }
          $unexpectedWarnings = @($warningLines | Where-Object {
            $_ -notmatch '^WARNING surface_inventory_observation:'
          })
          if ($unexpectedWarnings.Count -ne 0 -or $warningLines.Count -gt 1) {
            throw "Validator emitted unexpected warnings: $($warningLines -join ' | ')"
          }

      - name: Run full Python test suite
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:GITHUB_WORKSPACE 'ci-evidence/python-tests.txt'
          $output = @(& python -m unittest discover -s tests -v 2>&1)
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $log
          if ($exitCode -ne 0) {
            throw "Python tests failed with exit code $exitCode."
          }

          Import-Module -Name (Join-Path $env:GITHUB_WORKSPACE 'scripts/Ci-TestEvidence.Core.psm1') -Force
          $pythonEvidence = Get-PythonUnittestEvidence -Lines $output
          $pythonEvidenceLines = @(
            ConvertTo-CiTestEvidenceLines -Prefix 'Python' -Evidence $pythonEvidence
          )
          $pythonEvidenceLines | Add-Content -LiteralPath $log -Encoding utf8
          "### Python unittest: $($pythonEvidence.TestsRun) tests, 0 skipped, 0 failures, 0 errors" |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Restore .NET solution
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:GITHUB_WORKSPACE 'ci-evidence/dotnet-restore.txt'
          $output = @(& dotnet restore CompanionDesktopPet.sln -r win-x64 --nologo 2>&1)
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $log
          if ($exitCode -ne 0) {
            throw ".NET restore failed with exit code $exitCode."
          }

      - name: Require nonzero .NET full-solution test discovery
        run: |
          $ErrorActionPreference = 'Stop'
          $testProject = 'tests/CompanionDesktopPet.Tests/CompanionDesktopPet.Tests.csproj'
          $propertyLog = Join-Path $env:GITHUB_WORKSPACE 'ci-evidence/dotnet-test-project.txt'
          $propertyOutput = @(& dotnet msbuild $testProject -nologo -getProperty:IsTestProject 2>&1)
          $propertyExitCode = $LASTEXITCODE
          $propertyOutput | Tee-Object -FilePath $propertyLog
          if ($propertyExitCode -ne 0) {
            throw "Unable to inspect IsTestProject; exit code $propertyExitCode."
          }
          if (-not ($propertyOutput | Where-Object { $_.ToString().Trim() -eq 'true' })) {
            throw 'The .NET test project must set IsTestProject=true.'
          }

          $discoveryLog = Join-Path $env:GITHUB_WORKSPACE 'ci-evidence/dotnet-test-discovery.txt'
          $discovery = @(& dotnet test CompanionDesktopPet.sln `
            -c Release `
            --no-restore `
            --list-tests `
            --nologo `
            --verbosity quiet 2>&1)
          $discoveryExitCode = $LASTEXITCODE
          $discovery | Tee-Object -FilePath $discoveryLog
          if ($discoveryExitCode -ne 0) {
            throw ".NET test discovery failed with exit code $discoveryExitCode."
          }

          Import-Module -Name (Join-Path $env:GITHUB_WORKSPACE 'scripts/Ci-TestEvidence.Core.psm1') -Force
          $discoveryEvidence = Get-DotNetTestDiscoveryEvidence `
            -Lines $discovery
          $discoveryRecord = Join-Path $env:GITHUB_WORKSPACE 'ci-evidence/dotnet-test-discovery-count.txt'
          Save-CiTestEvidenceInteger `
            -Path $discoveryRecord `
            -Name 'DiscoveredTests' `
            -Value $discoveryEvidence.DiscoveredTests
          $discoveryEvidenceLines = @(
            ConvertTo-CiTestEvidenceLines -Prefix 'DotNetDiscovery' -Evidence $discoveryEvidence
          )
          $discoveryEvidenceLines | Add-Content -LiteralPath $discoveryLog -Encoding utf8
          "### .NET discovery: $($discoveryEvidence.DiscoveredTests) tests" |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Run full .NET Release test suite
        run: |
          $ErrorActionPreference = 'Stop'
          $results = Join-Path $env:GITHUB_WORKSPACE 'ci-evidence/dotnet-results'
          New-Item -ItemType Directory -Path $results -Force | Out-Null
          $log = Join-Path $env:GITHUB_WORKSPACE 'ci-evidence/dotnet-tests.txt'
          $output = @(& dotnet test CompanionDesktopPet.sln `
            -c Release `
            --no-restore `
            --nologo `
            --verbosity normal `
            --logger 'trx;LogFileName=release-tests.trx' `
            --results-directory $results 2>&1)
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $log
          if ($exitCode -ne 0) {
            throw ".NET Release tests failed with exit code $exitCode."
          }

          $trxFiles = @(Get-ChildItem -LiteralPath $results -Filter '*.trx' -File -Recurse)
          $discoveryRecord = Join-Path $env:GITHUB_WORKSPACE 'ci-evidence/dotnet-test-discovery-count.txt'
          Import-Module -Name (Join-Path $env:GITHUB_WORKSPACE 'scripts/Ci-TestEvidence.Core.psm1') -Force
          $expectedDiscoveredTests = Read-CiTestEvidenceInteger `
            -Path $discoveryRecord `
            -Name 'DiscoveredTests'
          $trxEvidence = Get-DotNetTrxEvidence `
            -TrxPaths @($trxFiles | ForEach-Object { $_.FullName }) `
            -ExpectedDiscoveredTests $expectedDiscoveredTests
          $trxEvidenceLines = @(
            ConvertTo-CiTestEvidenceLines -Prefix 'DotNetTRX' -Evidence $trxEvidence
          )
          $trxEvidenceLines | Add-Content -LiteralPath $log -Encoding utf8
          "### .NET Release: $($trxEvidence.Total) tests, $($trxEvidence.Passed) passed, 0 skipped/not-run/failed/error" |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Confirm committed contracts stayed unchanged
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:GITHUB_WORKSPACE 'ci-evidence/contract-diff.txt'
          $output = @(& git diff --exit-code -- `
            src/CompanionDesktopPet/Services/PersonaContract.g.cs `
            reports/simulation-events.json 2>&1)
          $exitCode = $LASTEXITCODE
          if ($output.Count -eq 0) {
            $output = @('PASS: generator and validation gates did not rewrite committed contracts.')
          }
          $output | Tee-Object -FilePath $log
          if ($exitCode -ne 0) {
            throw 'Quality gates modified a committed contract or simulation evidence file.'
          }

      - name: Upload quality-gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence
          if-no-files-found: warn
          retention-days: 30

  package:
    name: Package verified Windows release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: quality-gates
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      release_artifact_name: ${{ steps.release_artifact.outputs.name }}
      package_version: ${{ steps.package_version.outputs.value }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        id: setup-dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Require a release tag from main
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_PUSH_CREATED: ${{ github.event.created }}
          TAG_PUSH_FORCED: ${{ github.event.forced }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and
              ($env:TAG_PUSH_CREATED -cne 'true' -or $env:TAG_PUSH_FORCED -cne 'false')) {
            throw "Release tags must be brand-new, non-forced tag pushes: tag=$tag created=$env:TAG_PUSH_CREATED forced=$env:TAG_PUSH_FORCED"
          }

          Import-Module -Name (Join-Path $env:GITHUB_WORKSPACE 'scripts/Release-Packaging.Core.psm1') -Force
          $packageVersion = ConvertFrom-ReleaseTag -Tag $tag

          $tagRef = "refs/tags/$tag"
          $tagObjectType = ((& git cat-file -t $tagRef 2>&1) -join "`n").Trim()
          if ($LASTEXITCODE -ne 0 -or $tagObjectType -cne 'tag') {
            throw "Release tag must be an annotated tag: $tag"
          }

          $tagCommit = ((& git rev-parse "$tagRef^{commit}" 2>&1) -join "`n").Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -notmatch '^[a-f0-9]{40}$') {
            throw "Could not resolve release tag commit: $tag"
          }
          if ($tagCommit -cne $env:GITHUB_SHA) {
            throw "Checked-out commit differs from release tag: tag=$tagCommit checkout=$env:GITHUB_SHA"
          }

          & git merge-base --is-ancestor $tagCommit 'refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag $tag does not point to a commit contained in origin/main."
          }
          Write-Output "Release source accepted: $tag -> $tagCommit (origin/main), package version $packageVersion."

      - name: Verify committed .NET SDK
        env:
          SELECTED_DOTNET_SDK: ${{ steps.setup-dotnet.outputs.dotnet-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $selectedSdk = $env:SELECTED_DOTNET_SDK.Trim()
          $sdkContract = Get-Content -LiteralPath 'global.json' -Raw -Encoding utf8 |
            ConvertFrom-Json
          $expectedSdk = $sdkContract.sdk.version
          if ($expectedSdk -notmatch '^9\.0\.\d+$' -or
              $sdkContract.sdk.rollForward -cne 'disable' -or
              $sdkContract.sdk.allowPrerelease -ne $false) {
            throw 'Committed global.json must pin one stable .NET 9 SDK with rollForward=disable.'
          }
          $actualSdk = ((& dotnet --version 2>&1) -join "`n").Trim()
          if ($LASTEXITCODE -ne 0 -or
              $selectedSdk -cne $expectedSdk -or
              $actualSdk -cne $expectedSdk) {
            throw "The active .NET SDK differs from the committed contract: expected=$expectedSdk selected=$selectedSdk actual=$actualSdk"
          }
          Write-Output "Verified committed .NET SDK $actualSdk for this job."

      - name: Resolve package version from ref
        id: package_version
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            Import-Module -Name (Join-Path $env:GITHUB_WORKSPACE 'scripts/Release-Packaging.Core.psm1') -Force
            $packageVersion = ConvertFrom-ReleaseTag -Tag $env:GITHUB_REF_NAME
          }
          else {
            $packageVersion = "0.0.0-ci.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          }

          if ($packageVersion -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "Ref does not resolve to a supported package version: $packageVersion"
          }
          "PACKAGE_VERSION=$packageVersion" |
            Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "value=$packageVersion" |
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          Write-Output "Package version: $packageVersion"

      - name: Initialize clean release directories
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $rootPrefix = $repoRoot.TrimEnd('\') + '\'
          $releaseRoot = [IO.Path]::GetFullPath((Join-Path $repoRoot 'release-work'))
          $verifyRoot = [IO.Path]::GetFullPath((Join-Path $repoRoot 'outputs/verify'))
          foreach ($path in @($releaseRoot, $verifyRoot)) {
            if (-not $path.StartsWith($rootPrefix, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Cleanup target escaped repository root: $path"
            }
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Directory -Path (Join-Path $releaseRoot 'publish') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $releaseRoot 'delivery') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $releaseRoot 'evidence') -Force | Out-Null

      - name: Restore release project
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:GITHUB_WORKSPACE 'release-work/evidence/dotnet-restore.txt'
          $output = @(& dotnet restore `
            src/CompanionDesktopPet/CompanionDesktopPet.csproj `
            -r win-x64 `
            --nologo 2>&1)
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $log
          if ($exitCode -ne 0) {
            throw "Release restore failed with exit code $exitCode."
          }

      - name: Publish clean self-contained single-file app
        run: |
          $ErrorActionPreference = 'Stop'
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'release-work/publish'
          $log = Join-Path $env:GITHUB_WORKSPACE 'release-work/evidence/dotnet-publish.txt'
          $output = @(& dotnet publish `
            src/CompanionDesktopPet/CompanionDesktopPet.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            --nologo `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:ContinuousIntegrationBuild=true `
            -p:Version=$env:PACKAGE_VERSION `
            -p:SourceRevisionId=$env:GITHUB_SHA `
            -o $publishDir 2>&1)
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $log
          if ($exitCode -ne 0) {
            throw "Release publish failed with exit code $exitCode."
          }

      - name: Stage delivery names and current usage evidence
        run: |
          $ErrorActionPreference = 'Stop'
          $publishExe = Join-Path $env:GITHUB_WORKSPACE 'release-work/publish/CompanionDesktopPet.exe'
          $deliveryDir = Join-Path $env:GITHUB_WORKSPACE 'release-work/delivery'
          $deliveryExe = Join-Path $deliveryDir '佳怡桌宠.exe'
          $deliveryReadme = Join-Path $deliveryDir '使用说明.txt'
          Copy-Item -LiteralPath $publishExe -Destination $deliveryExe

          $sourceReadme = Join-Path $env:GITHUB_WORKSPACE 'outputs/CompanionDesktopPet/使用说明.txt'
          $readmeText = Get-Content -LiteralPath $sourceReadme -Raw -Encoding utf8
          $exe = Get-Item -LiteralPath $deliveryExe
          $exeSha256 = (Get-FileHash -LiteralPath $deliveryExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $gitSha = $env:GITHUB_SHA
          if ($gitSha -notmatch '^[a-fA-F0-9]{40}$') {
            throw "GITHUB_SHA is not a full Git commit SHA: $gitSha"
          }
          $productVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo($deliveryExe).ProductVersion
          $expectedProductVersion = "$env:PACKAGE_VERSION+$gitSha"
          if ($productVersion -cne $expectedProductVersion) {
            throw "Published EXE ProductVersion is not derived from the ref and commit. Expected=$expectedProductVersion; Actual=$productVersion"
          }
          $authenticode = Get-AuthenticodeSignature -FilePath $deliveryExe
          $authenticodeStatus = [string]$authenticode.Status
          if ($authenticodeStatus -cne 'NotSigned' -or
              $null -ne $authenticode.SignerCertificate -or
              $null -ne $authenticode.TimeStamperCertificate) {
            throw "Unsigned-release policy mismatch. Expected=NotSigned with no certificates; Actual=$authenticodeStatus"
          }

          $metadata = @(
            @{ Pattern = '(?m)^大小：.*$'; Value = "大小：$($exe.Length.ToString('N0', [Globalization.CultureInfo]::InvariantCulture)) 字节" }
            @{ Pattern = '(?m)^SHA-256：.*$'; Value = "SHA-256：$exeSha256" }
            @{ Pattern = '(?m)^built-from：.*$'; Value = "built-from：$gitSha" }
            @{ Pattern = '(?m)^Authenticode：.*$'; Value = "Authenticode：$authenticodeStatus" }
          )
          foreach ($entry in $metadata) {
            if ($readmeText -notmatch $entry.Pattern) {
              throw "Usage guide is missing release metadata matching $($entry.Pattern)."
            }
            $readmeText = [Regex]::Replace($readmeText, $entry.Pattern, $entry.Value)
          }

          $requiredNotice = @(
            Get-Content -LiteralPath 'NOTICE' -Encoding utf8 |
              Where-Object { $_ -match '^Required Notice:\s+\S' }
          ) -join "`n"
          if ([string]::IsNullOrWhiteSpace($requiredNotice)) {
            throw 'NOTICE has no Required Notice line to carry into the delivery guide.'
          }
          $licenseUrl = 'https://polyformproject.org/licenses/noncommercial/1.0.0'
          if (-not $readmeText.Contains($requiredNotice)) {
            $readmeText = $readmeText.TrimEnd() + @"


          许可与权利：
          Technical Code 按 PolyForm Noncommercial License 1.0.0 提供：
          $licenseUrl
          $requiredNotice
          "@
          }
          elseif (-not $readmeText.Contains($licenseUrl)) {
            throw 'Usage guide contains Required Notice but omits the PolyForm license URL.'
          }
          [IO.File]::WriteAllText($deliveryReadme, $readmeText, [Text.UTF8Encoding]::new($false))

          @(
            "DeliveryExe=$deliveryExe"
            "DeliveryExeBytes=$($exe.Length)"
            "DeliveryExeSHA256=$exeSha256"
            "PackageVersion=$env:PACKAGE_VERSION"
            "ProductVersion=$productVersion"
            "BuiltFrom=$gitSha"
            "AuthenticodeStatus=$authenticodeStatus"
            'AuthenticodeSigner=<none>'
            'AuthenticodeTimeStamper=<none>'
          ) | Set-Content -LiteralPath 'release-work/evidence/staging.txt' -Encoding utf8

      - name: Verify publish boundary and real WPF smoke test
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:GITHUB_WORKSPACE 'release-work/evidence/verify-publish.txt'
          $output = @(& powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Verify-Publish.ps1 `
            -ExePath 'release-work/delivery/佳怡桌宠.exe' `
            -PublishExePath 'release-work/publish/CompanionDesktopPet.exe' 2>&1)
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $log
          if ($exitCode -ne 0) {
            throw "Publish verification failed with exit code $exitCode."
          }

      - name: Run strengthened publish-verifier contract
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:GITHUB_WORKSPACE 'release-work/evidence/verify-publish-contract.txt'
          $output = @(& powershell -NoProfile -ExecutionPolicy Bypass -File tests/Verify-Publish.Contract.ps1 `
            -ExePath 'release-work/delivery/佳怡桌宠.exe' `
            -PublishExePath 'release-work/publish/CompanionDesktopPet.exe' 2>&1)
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath $log
          if ($exitCode -ne 0) {
            throw "Publish-verifier contract failed with exit code $exitCode."
          }

      - name: Assemble checksummed release assets
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module -Name (Join-Path $env:GITHUB_WORKSPACE 'scripts/Release-Packaging.Core.psm1') -Force
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'release-work/bundle'
          $distribution = Join-Path $env:GITHUB_WORKSPACE 'release-work/distribution'
          $zipVerification = Join-Path $env:GITHUB_WORKSPACE 'release-work/zip-verification'
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          New-Item -ItemType Directory -Path $distribution -Force | Out-Null

          $deliveryNames = @('佳怡桌宠.exe', '使用说明.txt')
          $legalSources = [ordered]@{
            'LICENSE' = 'LICENSE.md'
            'NOTICE' = 'NOTICE'
            'LICENSE-SCOPE.md' = 'LICENSE-SCOPE.md'
            'ASSET_AND_PERSONA_RIGHTS.md' = 'ASSET_AND_PERSONA_RIGHTS.md'
          }
          $legalNames = @($legalSources.Keys)
          $bundleNames = @($deliveryNames + $legalNames)
          foreach ($name in $deliveryNames) {
            Copy-Item -LiteralPath (Join-Path 'release-work/delivery' $name) -Destination (Join-Path $bundle $name)
          }
          foreach ($name in $legalNames) {
            Copy-Item -LiteralPath $legalSources[$name] -Destination (Join-Path $bundle $name)
          }

          # GitHub normalizes non-ASCII release-asset names. Keep the friendly
          # Chinese filenames inside the ZIP, but use portable outer names so
          # direct downloads never degrade to default.exe/default.txt.
          $releaseExeName = 'Jiayi-Desktop-Pet.exe'
          $releaseReadmeName = 'Jiayi-Desktop-Pet-README-zh-CN.txt'
          $zipName = 'Jiayi-Desktop-Pet-win-x64.zip'
          $zipPath = Join-Path $distribution $zipName
          New-DeterministicReleaseZip `
            -SourceDirectory $bundle `
            -EntryNames $bundleNames `
            -DestinationPath $zipPath

          New-Item -ItemType Directory -Path $zipVerification -Force | Out-Null
          Expand-Archive -LiteralPath $zipPath -DestinationPath $zipVerification -Force
          $unexpectedZipDirectories = @(Get-ChildItem -LiteralPath $zipVerification -Directory -Force -Recurse)
          $actualZipNames = @(
            Get-ChildItem -LiteralPath $zipVerification -File -Force |
              Select-Object -ExpandProperty Name |
              Sort-Object
          )
          $expectedZipNames = @($bundleNames | Sort-Object)
          if ($unexpectedZipDirectories.Count -ne 0 -or
              ($actualZipNames -join "`n") -cne ($expectedZipNames -join "`n")) {
            throw "Primary ZIP content is not the exact flat bundle: $($actualZipNames -join ', ')"
          }
          foreach ($name in $bundleNames) {
            $bundleHash = (Get-FileHash -LiteralPath (Join-Path $bundle $name) -Algorithm SHA256).Hash
            $zipHash = (Get-FileHash -LiteralPath (Join-Path $zipVerification $name) -Algorithm SHA256).Hash
            if ($zipHash -cne $bundleHash) {
              throw "Primary ZIP content differs from staged file: $name"
            }
          }

          Copy-Item -LiteralPath (Join-Path $bundle '佳怡桌宠.exe') -Destination (Join-Path $distribution $releaseExeName)
          Copy-Item -LiteralPath (Join-Path $bundle '使用说明.txt') -Destination (Join-Path $distribution $releaseReadmeName)
          foreach ($name in $legalNames) {
            Copy-Item -LiteralPath (Join-Path $bundle $name) -Destination (Join-Path $distribution $name)
          }

          $checksumTargets = @(
            $legalNames + $releaseExeName + $releaseReadmeName + $zipName |
              Sort-Object
          )
          $actualPreChecksumNames = @(
            Get-ChildItem -LiteralPath $distribution -File -Force |
              Select-Object -ExpandProperty Name |
              Sort-Object
          )
          if (($actualPreChecksumNames -join "`n") -cne ($checksumTargets -join "`n")) {
            throw "Release assets before checksumming are unexpected: $($actualPreChecksumNames -join ', ')"
          }
          $checksumLines = @($checksumTargets | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath (Join-Path $distribution $_) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $_"
          })
          [IO.File]::WriteAllLines(
            (Join-Path $distribution 'SHA256SUMS.txt'),
            $checksumLines,
            [Text.UTF8Encoding]::new($false)
          )

          $expectedNames = @($checksumTargets + 'SHA256SUMS.txt' | Sort-Object)
          $actualNames = @(Get-ChildItem -LiteralPath $distribution -File -Force | Select-Object -ExpandProperty Name | Sort-Object)
          if (($actualNames -join "`n") -cne ($expectedNames -join "`n")) {
            throw "Release distribution has unexpected files: $($actualNames -join ', ')"
          }

          @(
            "Ref=$env:GITHUB_REF"
            "Commit=$env:GITHUB_SHA"
            "PackageVersion=$env:PACKAGE_VERSION"
            "Run=$env:GITHUB_RUN_ID/$env:GITHUB_RUN_ATTEMPT"
            "DotNetSdk=$(& dotnet --version 2>&1)"
            $actualNames | ForEach-Object {
              $item = Get-Item -LiteralPath (Join-Path $distribution $_)
              $hash = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "AssetSHA256=$hash  Bytes=$($item.Length)  Name=$($_)"
            }
          ) | Set-Content -LiteralPath 'release-work/evidence/release-manifest.txt' -Encoding utf8
          $checksumLines | ForEach-Object { '- `' + $_ + '`' } |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Select release artifact name
        id: release_artifact
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactName = "companion-desktop-pet-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "name=$artifactName" |
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.release_artifact.outputs.name }}
          path: release-work/distribution
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload packaging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-work/evidence
          if-no-files-found: warn
          retention-days: 30

  github-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.package.outputs.release_artifact_name }}
          path: release-assets

      - name: Verify downloaded checksums
        run: |
          $ErrorActionPreference = 'Stop'
          $assetDirectory = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          $checksumTargets = @(
            'ASSET_AND_PERSONA_RIGHTS.md'
            'LICENSE'
            'LICENSE-SCOPE.md'
            'NOTICE'
            'Jiayi-Desktop-Pet-README-zh-CN.txt'
            'Jiayi-Desktop-Pet-win-x64.zip'
            'Jiayi-Desktop-Pet.exe'
          ) | Sort-Object
          $expectedNames = @($checksumTargets + 'SHA256SUMS.txt' | Sort-Object)
          $actualNames = @(Get-ChildItem -LiteralPath $assetDirectory -File -Force | Select-Object -ExpandProperty Name | Sort-Object)
          if (($actualNames -join "`n") -cne ($expectedNames -join "`n")) {
            throw "Downloaded release artifact has unexpected files: $($actualNames -join ', ')"
          }

          $checksumLines = @(Get-Content -LiteralPath (Join-Path $assetDirectory 'SHA256SUMS.txt') -Encoding utf8)
          if ($checksumLines.Count -ne $checksumTargets.Count) {
            throw 'SHA256SUMS.txt must hash every uploaded asset except itself exactly once.'
          }
          $checksumNames = @()
          foreach ($line in $checksumLines) {
            if ($line -notmatch '^(?<Hash>[a-f0-9]{64})  (?<Name>.+)$') {
              throw "Malformed checksum line: $line"
            }
            $expectedHash = $Matches['Hash']
            $assetName = $Matches['Name']
            if ([IO.Path]::GetFileName($assetName) -cne $assetName -or $checksumNames -ccontains $assetName) {
              throw "Checksum target name is unsafe or duplicated: $assetName"
            }
            $checksumNames += $assetName
            $path = Join-Path $assetDirectory $assetName
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Checksum target is missing: $assetName"
            }
            $actualHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) {
              throw "Checksum mismatch for $assetName."
            }
          }
          $actualChecksumNames = @($checksumNames | Sort-Object)
          if (($actualChecksumNames -join "`n") -cne ($checksumTargets -join "`n")) {
            throw "Checksum coverage does not exactly match uploaded assets: $($actualChecksumNames -join ', ')"
          }

      - name: Create immutable tag release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.package.outputs.package_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $repository = $env:GITHUB_REPOSITORY
          if ([string]::IsNullOrWhiteSpace($env:PACKAGE_VERSION)) {
            throw 'Package job did not provide the validated release version.'
          }
          if ($env:GITHUB_SHA -notmatch '^[a-fA-F0-9]{40}$') {
            throw "GITHUB_SHA is not a full Git commit SHA: $env:GITHUB_SHA"
          }

          $releaseTitle = "佳怡桌宠 $tag（Windows x64）"
          $descriptionMarker = '<!-- companion-release-description:zh-CN:v2 -->'
          $noUpdateClaim = '应用不包含热更新、自动更新或联网下载代码的机制'
          $unsignedClaim = '构建门禁已执行 Get-AuthenticodeSignature，并确认当前 EXE 状态为 NotSigned、无签名证书和时间戳证书'
          $requiredChineseHeadings = @(
            '## 发布亮点'
            '## 下载与运行'
            '## 完整性验证'
            '## 离线、单 EXE 与签名说明'
            '## 构建来源'
            '## 许可范围与权利声明'
          )
          $expectedProductVersion = "$env:PACKAGE_VERSION+$env:GITHUB_SHA"
          $assetNames = @(
            'ASSET_AND_PERSONA_RIGHTS.md'
            'LICENSE'
            'LICENSE-SCOPE.md'
            'NOTICE'
            'SHA256SUMS.txt'
            'Jiayi-Desktop-Pet-README-zh-CN.txt'
            'Jiayi-Desktop-Pet-win-x64.zip'
            'Jiayi-Desktop-Pet.exe'
          )
          $assets = @($assetNames | ForEach-Object { Join-Path 'release-assets' $_ })

          $requiredNotice = @(
            Get-Content -LiteralPath (Join-Path 'release-assets' 'NOTICE') -Encoding utf8 |
              Where-Object { $_ -match '^Required Notice:\s+\S' }
          ) -join "`n"
          if ([string]::IsNullOrWhiteSpace($requiredNotice)) {
            throw 'Downloaded NOTICE has no exact Required Notice line for the GitHub Release body.'
          }

          $encodedTag = [Uri]::EscapeDataString($tag)
          $licenseUrl = 'https://polyformproject.org/licenses/noncommercial/1.0.0'
          $licenseSourceUrl = "https://github.com/$repository/blob/$encodedTag/LICENSE.md"
          $scopeUrl = "https://github.com/$repository/blob/$encodedTag/LICENSE-SCOPE.md"
          $rightsUrl = "https://github.com/$repository/blob/$encodedTag/ASSET_AND_PERSONA_RIGHTS.md"
          $releaseBody = @"
          <!-- release-legal-notice:start -->
          $descriptionMarker
          # 佳怡桌宠 $tag（Windows x64）

          ## 发布亮点

          - 这是从已验证的 main 提交构建的正式 Windows x64 版本。
          - 发布前已完成质量门禁、单文件边界检查、真实 WPF 隔离烟测与 SHA-256 校验。
          - 桌宠、中文角色语料与本地状态均保持离线运行，不依赖网络、数据库或在线模型。

          ## 下载与运行

          - 推荐下载 Jiayi-Desktop-Pet-win-x64.zip；ZIP 内保留 佳怡桌宠.exe、使用说明.txt 与四份法律文件。
          - 也可以直接下载 Jiayi-Desktop-Pet.exe，并同时阅读 Jiayi-Desktop-Pet-README-zh-CN.txt。
          - 解压或下载后直接运行 EXE；运行最终程序不需要安装 Python 或 .NET SDK。

          ## 完整性验证

          - 下载 SHA256SUMS.txt，并使用 Get-FileHash -Algorithm SHA256 计算所下载文件的哈希。
          - 计算结果必须与 SHA256SUMS.txt 中相同文件名对应的 64 位 SHA-256 完全一致。
          - 主 ZIP、直接下载 EXE、说明文件和法律文件均包含在该校验清单中。

          ## 离线、单 EXE 与签名说明

          - 应用完全离线运行，不读取输入内容、剪贴板或窗口标题，也不枚举用户目录。
          - $noUpdateClaim；升级时需要由用户手动下载新版本并替换 EXE。
          - Jiayi-Desktop-Pet.exe 是 self-contained 的 Windows x64 单 EXE，旁边不需要应用 DLL、JSON 或 PDB。
          - $unsignedClaim；从网络下载时，Windows SmartScreen 或安全软件可能显示信誉提示。

          ## 构建来源

          - 标签：$tag
          - 提交 SHA：$env:GITHUB_SHA
          - 包版本：$env:PACKAGE_VERSION
          - EXE ProductVersion：$expectedProductVersion

          ## 许可范围与权利声明

          Technical Code 按 PolyForm Noncommercial License 1.0.0 提供：$licenseUrl

          仓库内可渲染的许可正文：$licenseSourceUrl

          $requiredNotice

          技术代码许可范围：$scopeUrl

          形象与人格权利边界：$rightsUrl

          桌宠形象、姓名、人格、口吻与语料不随技术代码许可一并授权；请在下载、运行或再分发前阅读上述完整范围。
          <!-- release-legal-notice:end -->
          "@.Trim()
          $bodyPath = Join-Path $env:RUNNER_TEMP 'companion-release-body.md'

          $releaseLookupOutput = @(& gh api "repos/$repository/releases/tags/$encodedTag" 2>&1)
          $releaseLookupExitCode = $LASTEXITCODE
          $releaseLookupText = $releaseLookupOutput -join "`n"
          $releaseExists = $releaseLookupExitCode -eq 0
          if (-not $releaseExists -and $releaseLookupText -notmatch '(?i)HTTP 404') {
            throw "Could not determine whether GitHub Release $tag exists: $releaseLookupText"
          }

          if ($releaseExists) {
            $releaseMetadata = $releaseLookupText | ConvertFrom-Json
            $existingAssetNames = @(
              @($releaseMetadata.assets) |
                ForEach-Object { $_.name } |
                Sort-Object
            )
            $expectedAssetNames = @($assetNames | Sort-Object)
            if (($existingAssetNames -join "`n") -cne ($expectedAssetNames -join "`n")) {
              throw "Existing GitHub Release $tag has a different asset manifest and is immutable: $($existingAssetNames -join ', ')"
            }

            $existingAssetDirectory = Join-Path $env:RUNNER_TEMP 'existing-companion-release-assets'
            if (Test-Path -LiteralPath $existingAssetDirectory) {
              Remove-Item -LiteralPath $existingAssetDirectory -Recurse -Force
            }
            New-Item -ItemType Directory -Path $existingAssetDirectory | Out-Null
            & gh release download $tag --repo $repository --dir $existingAssetDirectory
            if ($LASTEXITCODE -ne 0) {
              throw "Could not download existing immutable GitHub Release assets for $tag."
            }

            $downloadedDirectories = @(Get-ChildItem -LiteralPath $existingAssetDirectory -Directory -Force -Recurse)
            $downloadedAssetNames = @(
              Get-ChildItem -LiteralPath $existingAssetDirectory -File -Force |
                Select-Object -ExpandProperty Name |
                Sort-Object
            )
            if ($downloadedDirectories.Count -ne 0 -or
                ($downloadedAssetNames -join "`n") -cne ($expectedAssetNames -join "`n")) {
              throw "Downloaded existing GitHub Release $tag does not have the exact immutable asset manifest."
            }

            foreach ($assetName in $assetNames) {
              $candidateHash = (Get-FileHash -LiteralPath (Join-Path 'release-assets' $assetName) -Algorithm SHA256).Hash
              $existingHash = (Get-FileHash -LiteralPath (Join-Path $existingAssetDirectory $assetName) -Algorithm SHA256).Hash
              if ($existingHash -cne $candidateHash) {
                throw "Existing GitHub Release $tag asset differs from this build and cannot be replaced: $assetName"
              }
            }
            Write-Output "Existing GitHub Release $tag already has the exact immutable assets, including SHA256SUMS.txt; no mutation performed."
          }
          else {
            [IO.File]::WriteAllText($bodyPath, $releaseBody + "`n", [Text.UTF8Encoding]::new($false))
            & gh release create $tag @assets `
              --verify-tag `
              --notes-file $bodyPath `
              --title $releaseTitle `
              --repo $repository
            if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release publication failed with exit code $LASTEXITCODE."
            }
          }

          $publishedAssetNames = @(
            & gh release view $tag --repo $repository --json assets --jq '.assets[].name' 2>&1 |
              Sort-Object
          )
          if ($LASTEXITCODE -ne 0) {
            throw "Could not verify published GitHub Release assets for $tag."
          }
          $expectedAssetNames = @($assetNames | Sort-Object)
          if (($publishedAssetNames -join "`n") -cne ($expectedAssetNames -join "`n")) {
            throw "Published GitHub Release assets were renamed or are incomplete: $($publishedAssetNames -join ', ')"
          }

          $publishedTitleOutput = @(& gh release view $tag --repo $repository --json name --jq '.name' 2>&1)
          if ($LASTEXITCODE -ne 0) {
            throw "Could not verify published GitHub Release title for $tag."
          }
          $publishedTitle = $publishedTitleOutput -join "`n"
          if ($publishedTitle -cne $releaseTitle) {
            throw "Published GitHub Release title is not the required zh-CN title: $publishedTitle"
          }

          $publishedBodyOutput = @(& gh release view $tag --repo $repository --json body --jq '.body' 2>&1)
          if ($LASTEXITCODE -ne 0) {
            throw "Could not verify published GitHub Release body for $tag."
          }
          $publishedBody = $publishedBodyOutput -join "`n"
          if (-not $publishedBody.TrimStart().StartsWith('<!-- release-legal-notice:start -->') -or
              -not $publishedBody.Contains($licenseUrl) -or
              -not $publishedBody.Contains($licenseSourceUrl) -or
              -not $publishedBody.Contains($requiredNotice) -or
              -not $publishedBody.Contains($scopeUrl) -or
              -not $publishedBody.Contains($rightsUrl)) {
            throw 'Published GitHub Release body is missing the required visible legal preamble.'
          }

          $missingChineseHeadings = @($requiredChineseHeadings | Where-Object {
            -not $publishedBody.Contains($_)
          })
          if (-not $publishedBody.Contains($descriptionMarker) -or
              $missingChineseHeadings.Count -ne 0 -or
              -not $publishedBody.Contains($noUpdateClaim) -or
              -not $publishedBody.Contains($unsignedClaim) -or
              -not $publishedBody.Contains("标签：$tag") -or
              -not $publishedBody.Contains("提交 SHA：$env:GITHUB_SHA") -or
              -not $publishedBody.Contains("包版本：$env:PACKAGE_VERSION") -or
              -not $publishedBody.Contains("EXE ProductVersion：$expectedProductVersion")) {
            throw "Published GitHub Release body is missing the required zh-CN description contract: $($missingChineseHeadings -join ', ')"
          }
