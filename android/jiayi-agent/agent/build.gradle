plugins {
    id "com.android.library"
    id "com.chaquo.python"
}

android {
    namespace "com.jiayi.agent"
    compileSdk 35

    defaultConfig {
        minSdk 26
        consumerProguardFiles "consumer-rules.pro"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        buildPython "D:/desktop/CompanionDesktopPet/dialogue/python/Scripts/python.exe"
    }
    sourceSets {
        main {
            srcDir "D:/desktop/CompanionDesktopPet/dialogue"
        }
    }
}
